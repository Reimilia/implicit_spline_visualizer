name: Deploy implicit dynamics demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web_demo/**'
      - '.github/workflows/implicit-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: implicit-demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: web_demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
