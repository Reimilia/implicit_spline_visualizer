name: Deploy implicit dynamics demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web_demo/**'
      - '.github/workflows/implicit-demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: implicit-demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage Pages site
        run: |
          test -f web_demo/index.html
          mkdir -p _site/web_demo
          cp index.html _site/index.html
          cp -a web_demo/. _site/web_demo/
      - name: Upload staged site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
